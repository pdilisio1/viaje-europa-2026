<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Viaje Europa 2026</title>
<style>
:root{--bg:#0d0d0d;--pablo1:#12395e;--pablo2:#1f5c8f;--agus1:#8a1f47;--agus2:#c23768;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#f2f2f2;padding:24px;}
h1{font-size:20px;margin:0 0 4px;text-align:center;}
p{font-size:13px;color:#aaa;text-align:center;margin:0 0 10px;max-width:320px;}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:260px;padding:26px 20px;
  border-radius:20px;text-decoration:none;color:#fff;font-weight:700;font-size:18px;box-shadow:0 8px 22px rgba(0,0,0,.4);}
.opt.pablo{background:linear-gradient(160deg,var(--pablo1),var(--pablo2));}
.opt.agustina{background:linear-gradient(160deg,var(--agus1),var(--agus2));}
.opt .sub{font-size:11.5px;font-weight:500;opacity:.85;}
</style>
</head>
<body>
  <div>
    <h1>Viaje a Europa 2026</h1>
    <p>Elegi tu version del itinerario - cada una muestra solo tus propios tickets con QR.</p>
  </div>
  <a class="opt pablo" href="pablo.html">🔵 Pablo<span class="sub">Version con mis tickets</span></a>
  <a class="opt agustina" href="agustina.html">🔴 Agustina<span class="sub">Version con sus tickets</span></a>
</body>
</html>
